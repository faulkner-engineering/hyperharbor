name: Feature request
description: An idea for something HyperHarbor could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way today. A real example helps more than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, in the client, the host window, or both.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds or other tools you use for this.
