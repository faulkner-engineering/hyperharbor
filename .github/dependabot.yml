# Monthly dependency updates: one pull request per ecosystem (npm, cargo, nuget, github-actions) holds every minor and
# patch update. Major updates arrive one at a time, because they can need code changes. Security updates are not
# grouped and are not held for the schedule: Dependabot opens each one as soon as the advisory is published.
# CI runs on every pull request, so a broken update shows as a failed check.
# Ignored majors (the list and the reason are in docs/development.md, "Dependency updates"): windows, windows-core,
# and windows-sys, and Microsoft.Extensions.* and System.Diagnostics.EventLog, which move with the .NET runtime.
# Not covered: Kopia (pinned with its hashes in tools/tools.json) and the .NET SDK (global.json).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: System.Diagnostics.EventLog
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /client/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: windows-core
        update-types: ["version-update:semver-major"]
      - dependency-name: windows-sys
        update-types: ["version-update:semver-major"]
      - dependency-name: windows
        update-types: ["version-update:semver-major"]

  # The client and the tray window app share one pull request.
  - package-ecosystem: npm
    directories:
      - /client
      - /host/src/Host.Tray/webui
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
