name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) builds, tests, and packages a release and attaches it to a DRAFT
# GitHub release. Nothing reaches hosts until someone publishes the draft:
#   - stable: hosts read releases/latest/download/latest.json, which follows the newest published,
#     non-prerelease release.
#   - beta: publishing a prerelease copies its latest.json to the fixed "channel-beta" release, which beta
#     hosts read (the beta-channel job below).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: The tag matches the host and client versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $hostVersion = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $clientVersion = (Get-Content client/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content client/src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $packageVersion = (Get-Content client/package.json -Raw | ConvertFrom-Json).version
          $versions = @($hostVersion, $clientVersion, $cargoVersion, $packageVersion)
          if (@($versions | Where-Object { $_ -ne $tag }).Count -gt 0) {
            throw "Tag $tag does not match the host ($hostVersion), tauri.conf.json ($clientVersion), Cargo.toml ($cargoVersion), and package.json ($packageVersion) versions."
          }

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Test and package (full build)
        shell: pwsh
        env:
          # Signs the client installer for the client's updater (the public key is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package.ps1

      - name: The client update files exist
        shell: pwsh
        run: |
          foreach ($file in 'dist/client-latest.json') {
            if (-not (Test-Path $file)) { throw "$file is missing: check the TAURI_SIGNING_PRIVATE_KEY secrets." }
          }
          if (-not (Get-ChildItem dist/*-setup.exe.sig)) { throw 'The installer signature is missing.' }

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $assets = @("dist/HyperHarbor-Host-$version.exe", 'dist/latest.json', 'dist/client-latest.json') + (Get-ChildItem dist/*-setup.exe).FullName + (Get-ChildItem dist/*-setup.exe.sig).FullName
          $arguments = @('release', 'create', '${{ github.ref_name }}') + $assets + @('--draft', '--title', "HyperHarbor $version", '--generate-notes')
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }

  beta-channel:
    if: github.event_name == 'release' && github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Point the beta channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --pattern client-latest.json --dir manifest
          if ! gh release view channel-beta --repo "$REPO" > /dev/null 2>&1; then
            gh release create channel-beta --repo "$REPO" --prerelease --title "Beta channel" \
              --notes "Holds the beta channel's update manifests (latest.json for hosts, client-latest.json for clients). Do not delete."
          fi
          gh release upload channel-beta manifest/latest.json manifest/client-latest.json --repo "$REPO" --clobber
