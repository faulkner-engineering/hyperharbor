name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) packages a release and attaches it to a DRAFT GitHub release. The tests
# are not run again here: the draft is created only after the CI workflow has passed for the tagged commit, so
# tag a commit that was pushed to main. Nothing reaches hosts until someone publishes the draft:
#   - stable: hosts read releases/latest/download/latest.json, which follows the newest published,
#     non-prerelease release.
#   - beta: publishing a prerelease copies its latest.json to the fixed "channel-beta" release, which beta
#     hosts read (the beta-channel job below).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # A tag run can read caches only from main and from its own tag, so the release-profile dependencies come
      # from the cache the Release build cache workflow keeps on main. Saving here would help no later tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          shared-key: release
          save-if: false

      - name: The tag matches the host and client versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $hostVersion = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $clientVersion = (Get-Content client/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content client/src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $packageVersion = (Get-Content client/package.json -Raw | ConvertFrom-Json).version
          $versions = @($hostVersion, $clientVersion, $cargoVersion, $packageVersion)
          if (@($versions | Where-Object { $_ -ne $tag }).Count -gt 0) {
            throw "Tag $tag does not match the host ($hostVersion), tauri.conf.json ($clientVersion), Cargo.toml ($cargoVersion), and package.json ($packageVersion) versions."
          }

      # Before packaging, so a tag without its changelog section fails in seconds instead of after the build.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -OutFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Package (full build)
        shell: pwsh
        env:
          # Signs the client installer for the client's updater (the public key is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package.ps1 -SkipTests

      - name: The client update files exist
        shell: pwsh
        run: |
          foreach ($file in 'dist/client-latest.json') {
            if (-not (Test-Path $file)) { throw "$file is missing: check the TAURI_SIGNING_PRIVATE_KEY secrets." }
          }
          if (-not (Get-ChildItem dist/*-setup.exe.sig)) { throw 'The installer signature is missing.' }

      # CI runs for the same commit (pushed to main with the tag) while this job packages; wait for its result.
      - name: CI passed for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          $start = Get-Date
          while ($true) {
            $json = gh run list --repo '${{ github.repository }}' --workflow ci.yml --commit $sha --event push --json 'status,conclusion,url'
            if ($LASTEXITCODE -ne 0) { throw "gh run list failed ($LASTEXITCODE)." }
            # Newest first. ForEach-Object unrolls the array, which Windows PowerShell's ConvertFrom-Json does not.
            $runs = @($json | ConvertFrom-Json | ForEach-Object { $_ })
            if (@($runs | Where-Object conclusion -eq 'success').Count -gt 0) { Write-Host 'CI passed.'; break }
            $latest = $runs | Select-Object -First 1
            if ($latest -and $latest.status -eq 'completed') { throw "CI did not pass for $sha ($($latest.conclusion)): $($latest.url)" }
            $waited = (Get-Date) - $start
            if (-not $latest -and $waited.TotalMinutes -gt 5) { throw "No CI run for $sha. Push the commit to main, then push the tag." }
            if ($waited.TotalMinutes -gt 60) { throw "CI for $sha did not finish within an hour." }
            Start-Sleep -Seconds 30
          }

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $assets = @("dist/HyperHarbor-Host-$version.exe", 'dist/latest.json', 'dist/client-latest.json') + (Get-ChildItem dist/*-setup.exe).FullName + (Get-ChildItem dist/*-setup.exe.sig).FullName
          # The body is the version's CHANGELOG.md section; --generate-notes appends GitHub's list of pull requests and
          # the compare link.
          $arguments = @('release', 'create', '${{ github.ref_name }}') + $assets + @('--draft', '--title', "HyperHarbor $version", '--notes-file', "$env:RUNNER_TEMP/release-notes.md", '--generate-notes')
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }

  beta-channel:
    if: github.event_name == 'release' && github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Point the beta channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --pattern client-latest.json --dir manifest
          if ! gh release view channel-beta --repo "$REPO" > /dev/null 2>&1; then
            gh release create channel-beta --repo "$REPO" --prerelease --title "Beta channel" \
              --notes "Holds the beta channel's update manifests (latest.json for hosts, client-latest.json for clients). Do not delete."
          fi
          gh release upload channel-beta manifest/latest.json manifest/client-latest.json --repo "$REPO" --clobber
