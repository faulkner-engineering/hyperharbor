# only in the Edge Add-ons store (for example uBlock Origin, which the Chrome Web Store removed with Manifest V2).
# Every id is checked against its store by Live_EveryCatalogId_IsTheExtensionItSaysItIs (HH_EXTENSION_LIVE=1).
# Fields: id (32 letters a to p), name, category (privacy | security | productivity | developer | accessibility |
# media), description, store (chrome, the default, or edge), edgeId (optional, chrome entries only).
