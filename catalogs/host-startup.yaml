# Startup entries a host profile never disables, whatever its disable patterns say. Names are matched against the
# entry's name in the Run key or the Startup folder, with * and ? wildcards, ignoring case.
# Fields: pattern, reason.
- pattern: SecurityHealth*
  reason: The Windows Security tray icon.
- pattern: "*Defender*"
  reason: Antivirus.
- pattern: Malwarebytes*
  reason: Antivirus.
- pattern: Bitdefender*
  reason: Antivirus.
- pattern: Kaspersky*
  reason: Antivirus.
- pattern: ESET*
  reason: Antivirus.
- pattern: Norton*
  reason: Antivirus.
- pattern: McAfee*
  reason: Antivirus.
- pattern: Avast*
  reason: Antivirus.
- pattern: AVG*
  reason: Antivirus.
- pattern: RtkAudUService*
