# Package aliases and the Popular list for setup profiles. An alias (lowercase letters, digits, and hyphens)
# can stand for a winget id in a profile's install list; it is resolved when the profile is applied.
# Fields: alias, id (winget), name, description (one line, shown in the picker's details), category (browsers |
# development | utilities | media | communication | productivity | security | gaming), popular (shown on the
# Popular tab).
