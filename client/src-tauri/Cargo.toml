[package]
name = "hyperharbor-client"
version = "0.1.3"
description = "HyperHarbor desktop client"
authors = ["HyperHarbor"]
edition = "2021"
publish = false

[lib]
# The lib name must differ from the bin name to avoid a Windows linker conflict.
# See https://github.com/rust-lang/cargo/issues/8519
name = "hyperharbor_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21.4"
gethostname = "1.1.0"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
hex = "0.4.3"
getrandom = "0.4.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = "0.14.10"
tokio = { version = "1.53.1", features = ["sync", "fs", "net", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.23.1"
if-addrs = "0.15"
windows-sys = { version = "0.60", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

# Unsafe code is denied crate-wide; only the Win32 wrappers in rdp.rs opt out.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
