[package]
name = "hyperharbor-client"
version = "0.1.0"
description = "HyperHarbor desktop client"
authors = ["HyperHarbor"]
edition = "2021"
publish = false

[lib]
# The lib name must differ from the bin name to avoid a Windows linker conflict.
# See https://github.com/rust-lang/cargo/issues/8519
name = "hyperharbor_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21.4"
gethostname = "1.1.0"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
