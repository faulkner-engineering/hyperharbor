[package]
name = "hyperharbor-vcam"
version = "0.1.7-beta.1"
description = "HyperHarbor virtual camera source, loaded by the Windows Frame Server"
authors = ["HyperHarbor"]
edition = "2021"
publish = false
workspace = "../src-tauri"

[lib]
name = "hyperharbor_vcam"
crate-type = ["cdylib", "rlib"]

[dependencies]
hyperharbor-vcam-protocol = { path = "../vcam-protocol" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_KernelStreaming",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
