openapi: 3.1.0
info:
  title: HyperHarbor Host API
  version: 1.12.0
  summary: Manage Hyper-V virtual machines on a HyperHarbor host.
  description: |
    Contract between the HyperHarbor host service and HyperHarbor clients.

    Transport and security:
    - All endpoints are served over HTTPS using the host's self-signed certificate.
    - Every operation requires mutual TLS with a client certificate issued during
      pairing, except the pairing request and confirm operations, which are
      authenticated by the PIN-based key exchange described under the Pairing tag.
    - JSON property names are camelCase. Enumerations are serialized as strings.
    - Errors use RFC 7807 problem details (`application/problem+json`).
    - Every operation that changes state is recorded in the host's audit log with the User,
      device, virtual machine, and outcome. If the entry cannot be written, the operation is
      refused with 503.
    - While the host installs an update, every operation that changes state is refused with
      503, `code: updating`, and `Retry-After`; reads keep working until the service restarts.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}:{port}/api/v1
    description: HyperHarbor host
    variables:
      host:
        default: hyperharbor.local
        description: Host name or IP address discovered via mDNS or entered manually.
      port:
        default: "48443"
        description: API port advertised in the mDNS TXT record.
security:
  - mutualTLS: []
tags:
  - name: Host
    description: Host identity and version.
  - name: Performance
    description: GPU partitioning, fixed resources, and Remote Desktop tuning for Windows VMs.
  - name: Unattended
    description: Profiles and image inspection for installing an OS without anyone at the console.
  - name: VMs
    description: Virtual machine inventory and power actions.
  - name: Pairing
    description: |
      PIN-based pairing that exchanges and pins certificates using SPAKE2 over the
      RFC 3526 3072-bit group. The full construction, transcript, and test vectors are
      in docs/pairing.md.

      1. The client calls `POST /pairing/requests` with its self-signed certificate.
         The host shows a 6-digit PIN in the tray and returns its SPAKE2 share.
      2. The user enters the PIN on the client. The client calls
         `POST /pairing/requests/{pairingId}/confirm` with its share and confirmation.
      3. The host verifies the confirmation, stores the client certificate, and returns
         its own confirmation and certificate. The client verifies both before pinning.

      A pairing request expires after 120 seconds or after 5 failed confirm attempts.
      Only one request can be pending at a time; a new request from the same client
      certificate replaces that client's pending request. Clients cancel with
      `DELETE /pairing/requests/{pairingId}`.
  - name: Wake
    description: |
      Wake-on-LAN support. A sleeping host cannot wake itself, so clients cache the
      adapter details from `GET /wake/info` and send the magic packet directly.
      Relay mode is not part of this version.

      After a wake nobody is at the host, so Windows would soon sleep again. The host keeps
      itself awake while it is used: for 10 minutes after any authenticated request (reads
      included), while work is in progress, and while someone is signed in to it over Remote
      Desktop. Clients that keep a Remote Desktop or console window open check in with
      `GET /host` about once a minute.
  - name: Profiles
    description: |
      Setup profiles: what to install (winget), remove (provisioned Appx packages, capabilities,
      features), and change (registry tweaks, a browser with extensions and policies) in a Windows VM.
      Each User's profiles are YAML files on the host that follow schemas/profile.v1.schema.json
      (`GET /setup-profiles/schema`); every id in them is followed by a comment with its friendly name.
      Applying a profile is not part of this version.
  - name: Jobs
    description: Progress of long-running VM operations such as creation and deletion.
  - name: Auth
    description: |
      Elevation for operations that destroy data or change settings. The owner sets an admin
      passphrase from the tray on the host (it cannot be set through the API). A paired device
      sends it to `POST /auth/elevation` and receives a token that is valid for 5 minutes, for
      that device and its User only. Operations that need it list the `elevation` security
      scheme and return 403 with `code: elevationRequired` without a valid token, or
      `code: elevationUnavailable` when no passphrase is set.

      Wrong passphrases are limited to 5 per device in 15 minutes and 20 across all devices
      in an hour; beyond that the host returns 429 with `Retry-After`. Changing the passphrase,
      unpairing the device, or restarting the host service ends every elevation.
paths:
  /host:
    get:
      tags: [Host]
      operationId: getHostInfo
      summary: Get host identity and version.
      responses:
        "200":
          description: Host information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /host/update:
    get:
      tags: [Host]
      operationId: getHostUpdate
      summary: Get the host's update status and settings.
      description: |
        The installed host updates itself from its release channel: it checks periodically,
        downloads and verifies a newer version, tests it against a copy of its data, and installs
        it when nothing is in progress (or at the maintenance time), rolling back if it does not
        start. `supported` is false for a host run without installing it; such a host does not
        update itself.
      responses:
        "200":
          description: Update status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostUpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /host/update/check:
    post:
      tags: [Host]
      operationId: checkHostUpdate
      summary: Check the release channel now.
      description: |
        Starts a check and returns at once; poll `GET /host/update` for the result. A newer
        version is then downloaded and tested, and installed according to the update mode.
      responses:
        "202":
          description: The check has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostUpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UpdatesUnsupported"

  /host/update/install:
    post:
      tags: [Host]
      operationId: installHostUpdate
      summary: Install the ready update now.
      description: |
        Installs the version the host has already downloaded and tested (`activity: ready`),
        whatever the update mode and maintenance time. Work in progress (state-changing
        requests, running jobs, a pending pairing) still finishes first. The host restarts during
        the install; poll `GET /host/update` until it answers again. Returns 409 with
        `code: updateNotReady` when no version is ready (check first), or
        `code: updatesUnsupported` for a host run without installing it.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "202":
          description: The install starts once this request has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostUpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /host/update/settings:
    put:
      tags: [Host]
      operationId: setHostUpdateSettings
      summary: Change the update channel, mode, and maintenance time.
      description: |
        These decide what code the host runs, so the request needs elevation.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostUpdateSettings"
      responses:
        "200":
          description: The settings were saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostUpdateStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "409":
          $ref: "#/components/responses/UpdatesUnsupported"

  /host/resources:
    get:
      tags: [Host]
      operationId: getHostResources
      summary: Get the host's processors, memory, and VM folders.
      description: |
        Used to bound VM settings in the client. The host validates every request against the
        same figures and warns when a VM would leave less free memory than `memoryReserveMb`.
      responses:
        "200":
          description: Host resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /host/remote-desktop:
    get:
      tags: [Host]
      operationId: getHostRemoteDesktop
      summary: Get whether the host itself accepts Remote Desktop connections.
      description: |
        For maintenance sessions on the host. The client opens Remote Desktop to the host's
        address and the user signs in with their Windows account there; the host never sends or
        stores host credentials.
      responses:
        "200":
          description: The host's Remote Desktop state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostRemoteDesktop"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /host/remote-desktop/enable:
    post:
      tags: [Host]
      operationId: enableHostRemoteDesktop
      summary: Allow Remote Desktop connections to the host.
      description: |
        Allows Remote Desktop connections and enables the Windows Firewall "Remote Desktop" rule
        group. Network Level Authentication is left as it is. Returns 409 with
        `code: remoteDesktopUnsupported` on editions without a Remote Desktop server (Windows Home),
        or `code: requiresInstalledService` when the host runs without administrator rights.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "200":
          description: Remote Desktop is allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostRemoteDesktop"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /host/gpu:
    get:
      tags: [Performance]
      operationId: getHostGpu
      summary: List the host's GPUs and recent GPU driver errors.
      responses:
        "200":
          description: The GPUs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostGpu"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /isos:
    get:
      tags: [Host]
      operationId: listIsos
      summary: List the installation images in the host's ISO library.
      description: |
        The library is one folder on the host (`HostResources.isoFolder`, chosen in the host tray).
        Images are the files in it ending in .iso; links are not followed. Clients add, rename,
        and delete images through this API, so every paired client sees the same library.
        `usedBy` lists the VMs that have an image attached; those images cannot be renamed or
        deleted.
      responses:
        "200":
          description: The images, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IsoImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /isos/{name}:
    parameters:
      - $ref: "#/components/parameters/IsoName"
    put:
      tags: [Host]
      operationId: uploadIso
      summary: Add an image to the ISO library.
      description: |
        The body is the image file itself, sent as it is read (no size limit; send
        Content-Length so the host can check free space first). It is written to a temporary
        file and appears in the library only once the whole body has arrived, so a cancelled
        upload leaves nothing behind. Check for elevation before sending a large body: the host
        refuses an unelevated request before reading it.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The image was added.
          headers:
            Location:
              description: URL of the image.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsoImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "409":
          description: An image with this name is already in the library.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "507":
          description: The library's drive does not have room for the image.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      tags: [Host]
      operationId: renameIso
      summary: Rename an image in the ISO library.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameIsoRequest"
      responses:
        "200":
          description: The renamed image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsoImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another image has the new name, or a VM has this image attached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      tags: [Host]
      operationId: deleteIso
      summary: Delete an image from the ISO library.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "204":
          description: The image was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A VM has this image attached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /isos/{name}/inspection:
    parameters:
      - $ref: "#/components/parameters/IsoName"
    get:
      tags: [Unattended]
      operationId: inspectIso
      summary: Read what an image installs.
      description: |
        Reads the image without mounting it. Windows Setup media (UDF or ISO 9660) report their
        editions from sources\install.wim or install.esd; Ubuntu installers report their
        distribution from .disk\info. Anything else has `os` null, and can only be installed from
        the console. Results are cached until the file changes.
      responses:
        "200":
          description: What the image installs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsoInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /vms/{vmId}/install:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [Unattended]
      operationId: getVmInstall
      summary: Get the unattended install of a VM.
      description: |
        The host follows each unattended install: it waits for the installed system to report its OS
        and address through Hyper-V data exchange, then for Remote Desktop (Windows) or SSH (Linux) to
        answer a real protocol greeting. It then sets up the creating User's account with the one-time
        administrator credential, requires Remote Desktop to answer, replaces the administrator
        password, and ejects and deletes the answer file. Time while the VM is off does not count
        toward the install timeout (three hours of running time by default).
      responses:
        "200":
          description: The install.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnattendedInstallStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Unattended]
      operationId: cancelVmInstall
      summary: Stop following a VM's unattended install.
      description: |
        The VM keeps running, and the answer file is ejected and deleted. Finish the setup from the
        console, or with `POST /vms/{vmId}/provision`.
      responses:
        "204":
          description: The install was canceled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The VM has no install in progress, or its account is being set up right now.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /setup-profiles:
    get:
      tags: [Profiles]
      operationId: listSetupProfiles
      summary: List the calling User's setup profiles.
      description: |
        By name. A file on the host that no longer reads (for example after a hand edit) is listed
        with `error` set.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupProfileSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Profiles]
      operationId: createSetupProfile
      summary: Save a new setup profile for the calling User.
      description: |
        Needs elevation, because a profile decides what is installed and removed in VMs. The profile is
        checked against the schema and the catalogs (`400` with `errors` by field path, for example
        `install[3]`), tidied (duplicates dropped, names filled in from the catalogs), and saved under
        an ID made from its name.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupProfile"
      responses:
        "201":
          description: The saved profile.
          headers:
            Location:
              description: URL of the profile.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSetupProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"

  /setup-profiles/import:
    post:
      tags: [Profiles]
      operationId: importSetupProfile
      summary: Save a setup profile from a YAML file.
      description: |
        The body is the file (at most 256 KB). A file that is not a profile is `400` with an error on
        the `yaml` field; a profile with problems is `400` with errors by field path.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "201":
          description: The saved profile.
          headers:
            Location:
              description: URL of the profile.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSetupProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"

  /setup-profiles/schema:
    get:
      tags: [Profiles]
      operationId: getSetupProfileSchema
      summary: Get the JSON Schema of setup profile files.
      responses:
        "200":
          description: schemas/profile.v1.schema.json.
          content:
            application/schema+json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /setup-profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/SetupProfileId"
    get:
      tags: [Profiles]
      operationId: getSetupProfile
      summary: Get one of the calling User's setup profiles.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSetupProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Profiles]
      operationId: updateSetupProfile
      summary: Replace one of the calling User's setup profiles.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupProfile"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSetupProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Profiles]
      operationId: deleteSetupProfile
      summary: Delete one of the calling User's setup profiles.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "204":
          description: The profile was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /setup-profiles/{profileId}/yaml:
    parameters:
      - $ref: "#/components/parameters/SetupProfileId"
    get:
      tags: [Profiles]
      operationId: exportSetupProfile
      summary: Get the profile's YAML file as stored, for export.
      responses:
        "200":
          description: The file.
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /packages/search:
    get:
      tags: [Profiles]
      operationId: searchPackages
      summary: Search the winget community source.
      description: |
        Runs Find-WinGetPackage (Microsoft.WinGet.Client) in PowerShell 7 on the host. The service runs
        as SYSTEM, where the module works only in PowerShell 7, so search needs PowerShell 7 and the
        module installed for all users; until then it answers 409 with `code: wingetUnavailable`
        (on the host, the tray's Set up package search installs both). Results are cached for ten
        minutes.
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for (1 to 100 characters).
          schema:
            type: string
            maxLength: 100
        - name: count
          in: query
          required: false
          description: How many results, 1 to 50 (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: The packages found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Package search is not set up on the host (`code: wingetUnavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: winget ran and failed, for example because its source could not be reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /packages/catalog:
    get:
      tags: [Profiles]
      operationId: listPackageCatalog
      summary: List HyperHarbor's package catalog (aliases, and the picker's Popular tab).
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageCatalogItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /extensions/catalog:
    get:
      tags: [Profiles]
      operationId: listExtensionCatalog
      summary: List HyperHarbor's browser extension catalog.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtensionCatalogItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /extensions/resolve:
    get:
      tags: [Profiles]
      operationId: resolveExtension
      summary: Find an extension from a pasted store link or id.
      description: |
        Accepts a Chrome Web Store link, an Edge Add-ons link, an extension id, or edge:<id>. Catalog
        entries resolve without the network; anything else is looked up in its store (the host
        contacts only the stores' hosts, over HTTPS). The icon comes back as a data: URL, so clients
        load nothing remote. Results are cached for a day.
      parameters:
        - name: input
          in: query
          required: true
          description: The link or id.
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: The extension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedExtension"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The store could not be reached or answered something unexpected.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /unattend-profiles:
    get:
      tags: [Unattended]
      operationId: listUnattendProfiles
      summary: List the unattended install profiles the calling User can use.
      description: The three built-in profiles first, then the User's own profiles by name.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnattendProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Unattended]
      operationId: createUnattendProfile
      summary: Create an unattended install profile for the calling User.
      description: |
        Needs elevation, because a profile decides what future VMs get (for example which SSH keys
        can sign in). The audit entry records only the name and OS.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnattendProfileRequest"
      responses:
        "201":
          description: The new profile.
          headers:
            Location:
              description: URL of the profile.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnattendProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"

  /unattend-profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      tags: [Unattended]
      operationId: updateUnattendProfile
      summary: Replace one of the calling User's profiles.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnattendProfileRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnattendProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The profile is built in (`code` is `profileReadOnly`); copy it instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      tags: [Unattended]
      operationId: deleteUnattendProfile
      summary: Delete one of the calling User's profiles.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "204":
          description: The profile was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The profile is built in (`code` is `profileReadOnly`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /switches:
    get:
      tags: [Host]
      operationId: listSwitches
      summary: List the host's Hyper-V virtual switches.
      responses:
        "200":
          description: The switches, the Default Switch first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualSwitch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /auth/elevation:
    get:
      tags: [Auth]
      operationId: getElevation
      summary: Get the calling device's elevation state.
      responses:
        "200":
          description: Whether a passphrase is set and whether this device is elevated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Auth]
      operationId: elevate
      summary: Elevate the calling device with the admin passphrase.
      description: |
        Returns a token for the `X-HyperHarbor-Elevation` header. A new token replaces any
        earlier one for this device. The response is sent with `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElevateRequest"
      responses:
        "200":
          description: The device is elevated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The passphrase is wrong (`code: incorrectPassphrase`) or no passphrase is set
            (`code: elevationUnavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/ElevationRateLimited"
    delete:
      tags: [Auth]
      operationId: dropElevation
      summary: End the calling device's elevation.
      responses:
        "204":
          description: The device is no longer elevated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vms:
    get:
      tags: [VMs]
      operationId: listVms
      summary: List virtual machines on the host.
      responses:
        "200":
          description: All virtual machines visible to the host service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"
    post:
      tags: [VMs]
      operationId: createVm
      summary: Create a virtual machine that boots from an ISO.
      description: |
        Starts a creation job; poll `GET /jobs/{jobId}` (the `Location` header). The VM is
        Generation 2 with Secure Boot (Microsoft Windows template), a virtual TPM unless
        `enableTpm` is false, a new dynamic VHDX, and the ISO attached as a DVD that is first in
        the boot order. It is left off. If a step fails, the job removes the VM and its new disk.

        Errors in the request return 400 with `errors`. When the VM would leave the host with
        less free memory than the reserve, or the disk could outgrow its drive, the host returns
        409 with `code: resourceWarnings` and `warnings`; send the request again with
        `acknowledgeWarnings: true` to proceed.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVmRequest"
      responses:
        "202":
          description: The creation job started.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "409":
          description: Resource warnings to acknowledge, or a VM with this name is already being created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [VMs]
      operationId: getVm
      summary: Get a single virtual machine.
      responses:
        "200":
          description: The virtual machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/actions:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: performVmAction
      summary: Request a power action on a virtual machine.
      description: |
        Starts an asynchronous state change. Poll `GET /vms/{vmId}` (the `Location`
        header) to observe the resulting state.

        `turnOff` is equivalent to pulling the power cord and can lose unsaved data
        in the guest. Clients must confirm with the user before sending it, and the
        request needs elevation (the `X-HyperHarbor-Elevation` header). Other actions do not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmActionRequest"
            example:
              action: start
      responses:
        "202":
          description: The action was accepted.
          headers:
            Location:
              description: URL of the virtual machine resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/HyperVOperationFailed"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/provision:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: provisionVm
      summary: Create the calling User's local account in a VM.
      description: |
        One-time setup for one-click Remote Desktop. Creates (or reuses) the User's local
        account, for example `hh-owner`, with the given guest administrator credential, and
        optionally enables Remote Desktop. The VM is marked provisioned only after the account
        is verified.

        - Windows (10 / Server 2016 or later): PowerShell Direct; the account is added to
          Remote Desktop Users.
        - Linux: SSH with password authentication to the VM's address, then sudo; Remote
          Desktop is xrdp. The guest's SSH host key is pinned on first use and checked on
          every later connection, including when the VM is set up again (unless
          `trustNewHostKey` is true). Installing packages can take several minutes.

        The guest OS comes from `Vm.guestOs`; a VM whose family is `unknown` cannot be provisioned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionVmRequest"
      responses:
        "200":
          description: The account exists and was verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmProvisioning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not running, its guest OS is unknown or has no address (Linux), an
            existing account with the same name is not a local account, or (Linux) the guest's
            SSH host key differs from the pinned one and `trustNewHostKey` is false.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: The guest rejected the administrator credential.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/GuestOperationFailed"
        "503":
          $ref: "#/components/responses/GuestUnavailable"

  /vms/{vmId}/connect:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: connectVm
      summary: Get Remote Desktop credentials for the calling User's account.
      description: |
        Rotates the User's account password in the guest through PowerShell Direct and
        returns it. Rotations are serialized per VM and User; requests within the reuse
        window (60 seconds by default) receive the same password. The response is sent
        with `Cache-Control: no-store`.
      responses:
        "200":
          description: Credentials for Remote Desktop.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The VM is not provisioned for this User, is not running, or has no address.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/GuestOperationFailed"
        "503":
          $ref: "#/components/responses/GuestUnavailable"

  /vms/{vmId}/console:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: openVmConsole
      summary: Open the VM's console (its video output, before and after the guest OS starts).
      description: |
        Returns the calling User's host console account (for example `MYPC\hhc-owner`) with a
        freshly rotated password, the pre-connection blob that selects the VM, and a ticket for
        `POST /vms/{vmId}/console/tunnel`. The account is a standard local account on the host,
        created by "Set up console access" in the host's tray, and is granted access to this VM's
        console only. The host rotates its password again when the reuse window (60 seconds by
        default) ends; Remote Desktop sessions already signed in stay open.

        The client connects a Remote Desktop client to a local listener that forwards each
        connection through a tunnel, with `pcb:s:<pcb>` and `negotiate security layer:i:0`.
        The response is sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: Console credentials and a tunnel ticket.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not running or paused (`code: vmNotRunning`), console access is not set up
            on the host or its stored password is out of date (`code: consoleSetupRequired`), or
            the host's password policy refused a new password (`code: consolePasswordPolicy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/HyperVOperationFailed"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/console/tunnel:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: openVmConsoleTunnel
      summary: Open a byte tunnel to the host's Virtual Machine Connection service.
      description: |
        An HTTP/1.1 upgrade. Send `Connection: Upgrade`, `Upgrade: hyperharbor-console`, and the
        ticket from `openVmConsole` in `X-HyperHarbor-Console-Ticket`, with no body. After the
        101 response the connection carries raw Remote Desktop bytes to and from the host's port
        2179 on loopback, until either side closes. A ticket opens any number of tunnels for the
        same device, User, and VM until it expires. The audit entry for the outcome is written
        when the tunnel closes, with its duration and byte counts.
      parameters:
        - name: X-HyperHarbor-Console-Ticket
          in: header
          required: true
          description: The ticket from `openVmConsole`.
          schema:
            type: string
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: hyperharbor-console
      responses:
        "101":
          description: Switching protocols; the connection is now the tunnel.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The ticket is missing, expired, or was issued for another device, User, or VM.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "426":
          description: The request is not an HTTP/1.1 upgrade to `hyperharbor-console`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: The host's Virtual Machine Connection service did not answer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /vms/{vmId}/appx:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [Profiles]
      operationId: listVmAppx
      summary: List a VM's provisioned Appx packages, rated and compared with the clean baseline.
      description: |
        Reads a running Windows VM over PowerShell Direct as its stored administrator. Each package
        carries a removal rating from HyperHarbor's Appx catalog (`safe` ones make up the debloat
        preset). `baseline` is the clean list for the VM's build and edition (`approximate` when only
        another edition of the same build has one), recorded when an unattended install finished or on
        request; null when there is none.
      parameters:
        - name: source
          in: query
          required: false
          description: Where to read from. Only `vm` (the default) today.
          schema:
            type: string
            enum: [vm]
      responses:
        "200":
          description: The packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmAppxInventory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not a running Windows guest (`code: vmNotRunning`), or HyperHarbor has no
            administrator credential for it (`code: credentialRequired`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/GuestOperationFailed"
        "503":
          $ref: "#/components/responses/GuestUnavailable"

  /vms/{vmId}/appx-baseline:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [Profiles]
      operationId: recordAppxBaseline
      summary: Record this VM's provisioned packages as the clean baseline for its build and edition.
      description: |
        Use it on a VM installed by hand that nothing has been removed from yet. It replaces an existing
        baseline for the same build and edition.
      responses:
        "200":
          description: The recorded baseline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppxBaselineInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Not a running Windows guest (`code: vmNotRunning`), or no administrator credential
            (`code: credentialRequired`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/GuestOperationFailed"
        "503":
          $ref: "#/components/responses/GuestUnavailable"

  /vms/{vmId}/performance:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [Performance]
      operationId: getVmPerformance
      summary: Get a VM's Performance mode and its guest GPU driver.
      description: |
        `driver.drift` is true when the host's GPU driver changed since it was copied into the
        guest; run guest setup with `driversOnly` to copy it again.
      responses:
        "200":
          description: Performance mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Performance]
      operationId: applyVmPerformance
      summary: Turn Performance mode on, or change it, for an off VM.
      description: |
        Starts an `applyPerformance` job. It sets fixed memory (dynamic memory off) and the processor
        count, adds a GPU partition adapter with the chosen shares (or updates the existing one),
        turns checkpoints off, sets the automatic stop action to Turn Off, lets the guest control
        cache types, sets the MMIO gaps, and optionally moves the VM's storage. The VM must be off;
        there is no shut-down-and-apply.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceSettings"
      responses:
        "202":
          description: The job.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not off (`code` is `vmMustBeOff`), the host has no partitionable GPU (`gpuUnavailable`),
            host resource warnings need acknowledging (`resourceWarnings`), or another operation holds the VM.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      tags: [Performance]
      operationId: removeVmPerformance
      summary: Turn Performance mode off for an off VM.
      description: |
        Removes the GPU partition adapter and restores the default MMIO gaps, cache types, and the Save
        stop action. Memory stays fixed and checkpoints stay off; change those in the compute settings.
      security:
        - mutualTLS: []
          elevation: []
      responses:
        "204":
          description: Performance mode is off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The VM is not off (`code` is `vmMustBeOff`), or another operation holds it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /vms/{vmId}/performance/guest-setup:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [Performance]
      operationId: setUpVmPerformanceGuest
      summary: Copy the host's GPU driver into the guest and write the Remote Desktop settings.
      description: |
        Starts a `performanceGuestSetup` job. Over PowerShell Direct it copies the host GPU driver's
        DriverStore folder into the guest's System32\HostDriverStore\FileRepository and its other files
        into System32 or SysWOW64; files in use are replaced when the guest restarts (`rebootRequired`).
        Unless `driversOnly`, it also writes the Remote Desktop Session Host policies from
        TerminalServer.admx (hardware graphics adapters, H.264/AVC 444, image quality High, no RDP
        compression, hardware encoding as chosen) and DWMFRAMEINTERVAL 15 (60 fps). Needs a running
        Windows guest with Performance mode on and HyperHarbor's administrator credential for it.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSetupRequest"
      responses:
        "202":
          description: The job.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Performance mode is off, the VM is not a running Windows guest, HyperHarbor has no administrator
            credential for it (`code` is `credentialRequired`), or another operation holds the VM.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /vms/{vmId}/compute:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [VMs]
      operationId: getVmCompute
      summary: Get a VM's processor, memory, nested virtualization, and MAC spoofing settings.
      description: |
        `requiresOff` lists the settings that can change only while the VM is off. Maximum memory
        can change on a running VM while dynamic memory stays on; MAC address spoofing can change
        at any time.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmComputeSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"
    patch:
      tags: [VMs]
      operationId: updateVmCompute
      summary: Change a VM's processor, memory, nested virtualization, or MAC spoofing settings.
      description: |
        Omitted settings stay as they are. Changes are applied at once when the VM is off, or
        when it is running and no change needs it off (200 with `settings`). When a running VM
        must be off for a change, the host returns 409 with `code: requiresShutdown`, unless
        `shutDownToApply` is true: then a job shuts the guest down, applies the changes, and starts
        it again (202 with `job`). The job never forces the VM off; if the guest does not shut down
        in time, it fails and nothing changes. Saved and paused VMs cannot be changed.

        Nested virtualization needs static memory. Resource warnings work as for `createVm`.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVmComputeRequest"
      responses:
        "200":
          description: The changes were applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmComputeUpdate"
        "202":
          description: A job is shutting the VM down to apply the changes.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmComputeUpdate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A change needs the VM off (`code: requiresShutdown`), resource warnings to acknowledge,
            the VM is saved or paused, or another operation is in progress on it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          $ref: "#/components/responses/HyperVOperationFailed"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/delete-preview:
    parameters:
      - $ref: "#/components/parameters/VmId"
    get:
      tags: [VMs]
      operationId: getVmDeletePreview
      summary: Show what deleting a virtual machine would do.
      description: |
        Lists the disk files `deleteDisks` would delete, the number of checkpoints, and anything
        that prevents the deletion. Clients show this before asking the user to type the VM's
        name to confirm.
      responses:
        "200":
          description: The deletion preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDeletePreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/delete:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: deleteVm
      summary: Delete a virtual machine that is off.
      description: |
        Starts a deletion job; poll `GET /jobs/{jobId}` (the `Location` header). The VM must be
        off. When it has checkpoints, `deleteCheckpoints` must be true: they are merged into its
        disks first. With `deleteDisks`, the VM's own disk files are deleted too; a parent of
        its differencing disk is never deleted. Disks that another VM, or a differencing disk the
        VM does not use, depends on are never deleted or merged, and the request is refused.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDeleteRequest"
      responses:
        "202":
          description: The deletion job started.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not off, has checkpoints and `deleteCheckpoints` is false, a disk is shared
            or cannot be deleted, or another operation is in progress on the VM.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /vms/{vmId}/disks/export:
    parameters:
      - $ref: "#/components/parameters/VmId"
    post:
      tags: [VMs]
      operationId: exportVmDisks
      summary: Copy an off VM's virtual hard disks to a backup folder.
      description: |
        Starts an `exportDisks` job that copies the VM's virtual hard disks (never ISO images) into a
        new folder named after the VM and the host's local time, for example `Dev-20261004-1830`,
        under `destinationFolder` or the backup folder set in the host's tray. A disk with checkpoints
        is copied with its whole chain; the copies still name the original parent disks. The VM must
        be off (`code` is `vmMustBeOff` otherwise), and the destination volume must have room for every
        file. An incomplete export is removed.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDisksRequest"
      responses:
        "202":
          description: The export job started.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The VM is not off, has no virtual hard disks, the destination lacks free space, or
            another operation is in progress on the VM.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          $ref: "#/components/responses/HyperVUnavailable"

  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get the progress of a long-running VM operation.
      description: |
        Jobs are visible only to devices of the User who started them, and are kept for an hour
        after they finish. A host service restart forgets them.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /pairing/requests:
    post:
      tags: [Pairing]
      operationId: createPairingRequest
      summary: Begin pairing and display a PIN on the host.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: Pairing request created; the PIN is shown in the host tray.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: No tray app is connected to show the PIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /pairing/requests/{pairingId}:
    parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Pairing]
      operationId: cancelPairingRequest
      summary: Cancel a pending pairing request.
      description: |
        Ends the request and closes the PIN window on the host. The pairing ID is only
        known to the client that created the request.
      security: []
      responses:
        "204":
          description: The request was cancelled.
        "404":
          $ref: "#/components/responses/NotFound"

  /pairing/requests/{pairingId}/confirm:
    parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Pairing]
      operationId: confirmPairing
      summary: Prove knowledge of the PIN and complete pairing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingConfirmation"
      responses:
        "200":
          description: Pairing completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The confirmation did not match; the PIN was wrong or the exchange was tampered with.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The pairing request expired or the attempt limit was reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /pairing/devices/self:
    delete:
      tags: [Pairing]
      operationId: unpairSelf
      summary: Remove the calling device's pairing.
      description: Revokes the client certificate used for this request.
      responses:
        "204":
          description: The device was unpaired.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wake/info:
    get:
      tags: [Wake]
      operationId: getWakeInfo
      summary: Get network adapter details needed to wake the host.
      responses:
        "200":
          description: Wake-capable adapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wake/readiness:
    get:
      tags: [Wake]
      operationId: getWakeReadiness
      summary: Check whether the host is configured to wake on LAN.
      responses:
        "200":
          description: Readiness check results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeReadiness"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wake/readiness/fix:
    post:
      tags: [Wake]
      operationId: fixWakeReadiness
      summary: Apply automatic fixes for failed readiness checks.
      description: |
        Fixes change system settings, so the request needs an elevation token from the admin
        passphrase. When the host service has administrator rights (the installed service runs
        as LocalSystem), the fixes are applied immediately (200). Otherwise the host tray also
        asks the user to approve them with a UAC prompt (202); poll `GET /wake/readiness` to see
        the result. Only checks with `autoFixAvailable` can be fixed.
      security:
        - mutualTLS: []
          elevation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WakeFixRequest"
      responses:
        "200":
          description: Readiness check results after applying fixes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeReadiness"
        "202":
          description: The user at the host has been asked to approve the fixes.
          headers:
            Location:
              description: URL of the readiness resource to poll.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ElevationRequired"
        "503":
          description: Approval is needed and no tray app is running on the host to ask.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /wake/test:
    post:
      tags: [Wake]
      operationId: startWakeTest
      summary: Put the host to sleep after a delay so the client can test waking it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WakeTestRequest"
      responses:
        "202":
          description: The host will sleep at the indicated time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeTestScheduled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Client certificate issued to the device during pairing.
    elevation:
      type: apiKey
      in: header
      name: X-HyperHarbor-Elevation
      description: |
        Token from `POST /auth/elevation`. Required, in addition to the client certificate,
        by operations that list this scheme.

  parameters:
    VmId:
      name: vmId
      in: path
      required: true
      description: Hyper-V virtual machine ID.
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      description: An unattended profile ID.
      schema:
        type: string
        maxLength: 64
    SetupProfileId:
      name: profileId
      in: path
      required: true
      description: A setup profile ID (its file name on the host).
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
    IsoName:
      name: name
      in: path
      required: true
      description: An image file name in the ISO library, ending in .iso (URL-encoded).
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      description: Job ID returned when the job was started.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: The client certificate is missing or not paired with this host.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UpdatesUnsupported:
      description: |
        The host runs without being installed, so it does not update itself
        (`code: updatesUnsupported`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: The operation is not valid in the current state, or another operation is in progress on the VM.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    HyperVOperationFailed:
      description: Hyper-V rejected the request with an unexpected return code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GuestOperationFailed:
      description: An operation in the guest (PowerShell Direct or SSH) failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GuestUnavailable:
      description: |
        The guest is not ready: PowerShell Direct cannot reach it (still starting, or integration
        services are off), or SSH on port 22 does not answer (Linux).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    HyperVUnavailable:
      description: Hyper-V is not enabled or the host service cannot access it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Another pairing request is already pending.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ElevationRequired:
      description: |
        The request needs elevation and has no valid token (`code: elevationRequired`), or no
        admin passphrase is set on the host (`code: elevationUnavailable`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ElevationRateLimited:
      description: Too many wrong passphrases (`code` is `tooManyAttempts`).
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Set for errors a client handles differently from others with the same status:
            `elevationRequired`, `elevationUnavailable`, `incorrectPassphrase`, `tooManyAttempts`,
            `resourceWarnings` (see `warnings`), `requiresShutdown`, `consoleSetupRequired`,
            `vmNotRunning`, `consolePasswordPolicy`, `profileReadOnly`, `vmMustBeOff`, `gpuUnavailable`, `credentialRequired`,
            `remoteDesktopUnsupported`, `requiresInstalledService`, `updateNotReady`, `wingetUnavailable`.
        errors:
          type: array
          description: Field-level validation problems (400).
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          description: |
            Host resource warnings (409 with `code: resourceWarnings`). Send the request again with
            `acknowledgeWarnings: true` to proceed.
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The request property, for example `processorCount`.
        message:
          type: string

    HostInfo:
      type: object
      required: [hostId, hostName, version, apiVersion, certificateFingerprint]
      properties:
        hostId:
          type: string
          format: uuid
          description: Stable identifier generated at first run.
        hostName:
          type: string
          description: Windows computer name.
        version:
          type: string
          description: Host service version.
        apiVersion:
          type: string
          description: Contract version implemented by the host.
        certificateFingerprint:
          type: string
          pattern: "^[0-9A-F]{64}$"
          description: SHA-256 fingerprint of the host TLS certificate, uppercase hex.
      example:
        hostId: 6f1c2b8e-3a4d-4c55-9e1f-2b7a9d0c4e11
        hostName: GAMING-PC
        version: 0.1.0
        apiVersion: 1.0.0
        certificateFingerprint: 3F2A9C1D4B5E6F708192A3B4C5D6E7F8091A2B3C4D5E6F708192A3B4C5D6E7F8

    HostUpdateMode:
      type: string
      enum: [auto, notify, off]
      description: |
        auto installs when nothing is in progress (or at the maintenance time); notify downloads
        and tests a new version but installs it only when the owner chooses Install now in the tray;
        off does not check.

    HostUpdateActivity:
      type: string
      enum: [idle, checking, preparing, ready, installing]
      description: |
        preparing means downloading, verifying, and testing a new version; ready means it waits to
        be installed; installing means the host is about to restart on it.

    HostUpdateStatus:
      type: object
      required:
        [supported, mode, channel, channels, maintenanceTime, currentVersion, availableVersion,
         notesUrl, activity, lastCheck, message, lastResult, rolledBack]
      properties:
        supported:
          type: boolean
          description: False when the host runs without being installed; it then does not update itself.
        mode:
          $ref: "#/components/schemas/HostUpdateMode"
        channel:
          type: string
        channels:
          type: array
          items:
            type: string
          description: The channels this host can follow.
        maintenanceTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Host local time (HH:mm) after which an install may start without waiting for idle.
        currentVersion:
          type: string
        availableVersion:
          type: [string, "null"]
          description: The newer version the channel offers, when there is one.
        notesUrl:
          type: [string, "null"]
          format: uri
        activity:
          $ref: "#/components/schemas/HostUpdateActivity"
        lastCheck:
          type: [string, "null"]
          format: date-time
        message:
          type: [string, "null"]
          description: What the host is doing or why the last step failed.
        lastResult:
          type: [string, "null"]
          description: How the last installation ended, for example a rollback.
        rolledBack:
          type: array
          items:
            type: string
          description: Versions that did not start here and were rolled back; they are not offered again.
      example:
        supported: true
        mode: auto
        channel: stable
        channels: [stable, beta]
        maintenanceTime: "03:00"
        currentVersion: 0.1.0
        availableVersion: 0.2.0
        notesUrl: https://github.com/faulkner-engineering/hyperharbor/releases/tag/v0.2.0
        activity: ready
        lastCheck: "2026-10-04T12:00:00Z"
        message: Version 0.2.0 is ready to install.
        lastResult: null
        rolledBack: []

    HostUpdateSettings:
      type: object
      required: [channel, mode, maintenanceTime]
      properties:
        channel:
          type: string
          description: One of the status's channels.
        mode:
          $ref: "#/components/schemas/HostUpdateMode"
        maintenanceTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:mm host local time, or null for none.

    VmState:
      type: string
      enum: [running, off, saved, paused, starting, stopping, saving, pausing, resuming, other]

    GuestOsFamily:
      type: string
      description: |
        Operating system family the guest reports through Hyper-V data exchange (KVP).
        `unknown` when the guest is not running, has not finished starting, or does not run
        the data exchange integration service.
      enum: [unknown, windows, linux]

    VmGuestOs:
      type: object
      required: [family, name]
      properties:
        family:
          $ref: "#/components/schemas/GuestOsFamily"
        name:
          type: [string, "null"]
          description: Name and version the guest reports, for example "Windows 11 Pro" or "Ubuntu 24.04".

    VmAction:
      type: string
      description: |
        - `start`: power on or resume from saved state.
        - `shutdown`: graceful guest shutdown via integration services.
        - `turnOff`: immediate power off. Can lose unsaved guest data.
        - `save`: save memory state to disk and stop.
        - `restart`: graceful guest restart.
      enum: [start, shutdown, turnOff, save, restart]

    Vm:
      type: object
      required: [id, name, state, generation, rdpAvailable, ipAddresses, provisioned, remoteDesktop, guestOs]
      properties:
        id:
          type: string
          format: uuid
          description: Hyper-V virtual machine ID.
        name:
          type: string
        state:
          $ref: "#/components/schemas/VmState"
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        cpuUsagePercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        memoryAssignedMb:
          type: [integer, "null"]
          format: int64
          minimum: 0
        generation:
          type: integer
          enum: [1, 2]
        rdpAvailable:
          type: boolean
          description: |
            True when the VM accepted a TCP connection on port 3389 from the host. A VM on an
            internal or NAT switch can be available to the host but unreachable from other devices.
        ipAddresses:
          type: array
          items:
            type: string
        provisioned:
          type: boolean
          description: |
            True when the calling device's User has a verified local account on this VM, so
            `POST /vms/{vmId}/connect` can be used.
        remoteDesktop:
          $ref: "#/components/schemas/VmRemoteDesktop"
        guestOs:
          $ref: "#/components/schemas/VmGuestOs"
        installState:
          description: |
            The unattended install of this VM while it runs or after it failed. Absent for VMs installed
            from the console and once the install is ready.
          oneOf:
            - $ref: "#/components/schemas/UnattendedInstallState"
            - type: "null"
        performanceMode:
          type: boolean
          default: false
          description: True when Performance mode (GPU partition and Remote Desktop tuning) is on.
      example:
        id: 0b9a6f53-1c2d-4e8f-a1b2-3c4d5e6f7a8b
        name: Dev Workstation
        state: running
        uptimeSeconds: 3600
        cpuUsagePercent: 12
        memoryAssignedMb: 8192
        generation: 2
        rdpAvailable: true
        ipAddresses: [192.168.1.50]
        provisioned: true
        remoteDesktop:
          address: 192.168.1.50
          reachableFromHost: true
        guestOs:
          family: windows
          name: Windows 11 Pro

    VmRemoteDesktop:
      type: object
      required: [address, reachableFromHost]
      properties:
        address:
          type: [string, "null"]
          description: The guest address clients connect to, or null when the guest reports none.
        reachableFromHost:
          type: boolean
          description: Same as Vm.rdpAvailable.

    ProvisionVmRequest:
      type: object
      required: [adminUserName, adminPassword]
      properties:
        adminUserName:
          type: string
          minLength: 1
          description: |
            Windows: a local administrator, for example "Administrator" or ".\\admin".
            Linux: an account that can sign in over SSH with a password and use sudo.
        adminPassword:
          type: string
          minLength: 1
          description: Stored on the host with DPAPI for later password rotation. Never logged.
        enableRemoteDesktop:
          type: boolean
          default: true
          description: |
            Windows: also enable Remote Desktop and its firewall rule. Linux: also install, enable,
            and open the firewall for xrdp.
        installDesktop:
          type: boolean
          default: false
          description: |
            Linux only: install a lightweight desktop (Xfce) when the guest has none. Remote Desktop
            on Linux needs a desktop environment. Ignored for Windows guests.
        trustNewHostKey:
          type: boolean
          default: false
          description: |
            Linux only: accept an SSH host key that differs from the one pinned when the VM was
            last set up, for example after the guest was reinstalled. When false, a changed key
            fails with 409 and nothing is sent to the guest after the key exchange. Ignored for
            Windows guests.

    VmProvisioning:
      type: object
      required: [vmId, accountName, provisionedAt]
      properties:
        vmId:
          type: string
          format: uuid
        accountName:
          type: string
          description: The User's local account in the guest, for example hh-owner.
        provisionedAt:
          type: string
          format: date-time

    VmConnection:
      type: object
      required: [userName, password, address, port, expiresAt, guestOs]
      properties:
        userName:
          type: string
          description: The plain account name to sign in with, for example "hh-owner"; it is the guest's local account.
        password:
          type: string
          description: |
            Current password for the account. Valid until the next rotation; requests within
            the reuse window receive the same password. Clients must not persist it.
        address:
          type: string
        port:
          type: integer
          default: 3389
        expiresAt:
          type: string
          format: date-time
          description: End of the reuse window. The password stays valid until the next connect after it.
        guestOs:
          $ref: "#/components/schemas/GuestOsFamily"
          description: Linux guests use xrdp, which signs in over TLS instead of CredSSP (NLA).
        performanceMode:
          type: boolean
          default: false
          description: The client tunes the connection for a LAN (connection type LAN, auto-detection off).

    ConsoleSession:
      type: object
      required: [ticket, userName, password, pcb, expiresAt, ticketExpiresAt]
      properties:
        ticket:
          type: string
          description: Opens tunnels with `POST /vms/{vmId}/console/tunnel`. Clients must not persist it.
        userName:
          type: string
          description: The host console account, qualified with the host's computer name, for example "MYPC\hhc-owner".
        password:
          type: string
          description: |
            Valid until the reuse window ends, when the host rotates it again. Requests within the
            window receive the same password. Clients must not persist it.
        pcb:
          type: string
          description: The Remote Desktop pre-connection blob that selects the VM (its ID).
        expiresAt:
          type: string
          format: date-time
          description: End of the password's reuse window.
        ticketExpiresAt:
          type: string
          format: date-time
          description: After this, the ticket opens no more tunnels. Open tunnels stay open.

    VmActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/VmAction"

    VmActionResult:
      type: object
      required: [vmId, action, accepted, state]
      properties:
        vmId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/VmAction"
        accepted:
          type: boolean
        state:
          $ref: "#/components/schemas/VmState"
      example:
        vmId: 0b9a6f53-1c2d-4e8f-a1b2-3c4d5e6f7a8b
        action: turnOff
        accepted: true
        state: stopping

    PairingRequest:
      type: object
      required: [deviceName, clientCertificatePem]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 64
          description: Name shown in the host tray.
        clientCertificatePem:
          type: string
          description: PEM-encoded self-signed client certificate.

    PairingRequestCreated:
      type: object
      required: [pairingId, hostShare, expiresAt]
      properties:
        pairingId:
          type: string
          format: uuid
        hostShare:
          type: string
          format: byte
          description: SPAKE2 share Y, 384 bytes big-endian, Base64 encoded.
        expiresAt:
          type: string
          format: date-time

    PairingConfirmation:
      type: object
      required: [clientShare, clientConfirmation]
      properties:
        clientShare:
          type: string
          format: byte
          description: SPAKE2 share X, 384 bytes big-endian, Base64 encoded.
        clientConfirmation:
          type: string
          format: byte
          description: Confirmation cA (HMAC-SHA256), Base64 encoded.

    PairingResult:
      type: object
      required: [deviceId, userId, hostId, hostCertificatePem, hostConfirmation]
      properties:
        deviceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: |
            The User the new device belongs to. A User owns many devices and has one local
            account on each provisioned VM.
        hostId:
          type: string
          format: uuid
        hostCertificatePem:
          type: string
          description: PEM-encoded host certificate to pin.
        hostConfirmation:
          type: string
          format: byte
          description: Confirmation cB (HMAC-SHA256), Base64 encoded.

    WakeAdapter:
      type: object
      required: [name, macAddress, ipv4Address, broadcastAddress]
      properties:
        name:
          type: string
        macAddress:
          type: string
          pattern: "^([0-9A-F]{2}-){5}[0-9A-F]{2}$"
        ipv4Address:
          type: string
          format: ipv4
        broadcastAddress:
          type: string
          format: ipv4

    WakeInfo:
      type: object
      required: [adapters]
      properties:
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/WakeAdapter"
      example:
        adapters:
          - name: Ethernet
            macAddress: 00-1A-2B-3C-4D-5E
            ipv4Address: 192.168.1.10
            broadcastAddress: 192.168.1.255

    WakeCheckStatus:
      type: string
      enum: [pass, warn, fail]

    WakeCheck:
      type: object
      required: [id, title, status, autoFixAvailable]
      properties:
        id:
          type: string
          description: |
            Stable check identifier: `wiredAdapter`, `nicWakeOnMagicPacket`,
            `nicAllowWake`, `sleepKeepsNetwork`, or `fastStartupDisabled`. Clients should
            show unknown identifiers using `title` and `detail`.
        title:
          type: string
        status:
          $ref: "#/components/schemas/WakeCheckStatus"
        detail:
          type: string
        autoFixAvailable:
          type: boolean

    WakeReadiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
          description: True when no check has status `fail`.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/WakeCheck"
      example:
        ready: false
        checks:
          - id: nicWakeOnMagicPacket
            title: Network adapter wakes on magic packet
            status: fail
            detail: Wake on Magic Packet is disabled on adapter Ethernet.
            autoFixAvailable: true

    WakeFixRequest:
      type: object
      required: [checkIds]
      properties:
        checkIds:
          type: array
          minItems: 1
          items:
            type: string

    WakeTestRequest:
      type: object
      required: [delaySeconds]
      properties:
        delaySeconds:
          type: integer
          minimum: 5
          maximum: 300

    WakeTestScheduled:
      type: object
      required: [sleepAt]
      properties:
        sleepAt:
          type: string
          format: date-time

    ElevateRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: The admin passphrase set in the host tray. Never logged or stored by the host.

    ElevationGrant:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: Send in the `X-HyperHarbor-Elevation` header. Keep it out of logs and storage.
        expiresAt:
          type: string
          format: date-time

    ElevationStatus:
      type: object
      required: [configured, active, expiresAt]
      properties:
        configured:
          type: boolean
          description: True when an admin passphrase is set on the host.
        active:
          type: boolean
          description: True when the calling device holds an unexpired elevation token.
        expiresAt:
          type: [string, "null"]
          format: date-time

    VmDeleteRequest:
      type: object
      required: [deleteDisks, deleteCheckpoints, confirmName]
      properties:
        deleteDisks:
          type: boolean
          description: Also delete the VM's own disk files. Parent disks are never deleted.
        deleteCheckpoints:
          type: boolean
          description: Required when the VM has checkpoints. They are merged into its disks first.
        confirmName:
          type: string
          description: Must equal the VM's name exactly.

    ExportDisksRequest:
      type: object
      properties:
        destinationFolder:
          type: [string, "null"]
          description: A fully qualified folder on the host. Null or absent uses the backup folder set in the tray.

    DeleteBlockerCode:
      type: string
      enum: [notOff, sharedDisk, diskNotDeletable]

    DeleteBlockerScope:
      type: string
      description: |
        Which deletions a blocker prevents. `always`; `deleteDisks` (only when deleting disks);
        `deleteDisksOrCheckpoints` (when deleting disks, or merging checkpoints into them).
      enum: [always, deleteDisks, deleteDisksOrCheckpoints]

    DeleteBlocker:
      type: object
      required: [code, scope, message]
      properties:
        code:
          $ref: "#/components/schemas/DeleteBlockerCode"
        scope:
          $ref: "#/components/schemas/DeleteBlockerScope"
        message:
          type: string

    VmDeletePreview:
      type: object
      required: [vmId, vmName, state, checkpointCount, disks, blockers]
      properties:
        vmId:
          type: string
          format: uuid
        vmName:
          type: string
        state:
          $ref: "#/components/schemas/VmState"
        checkpointCount:
          type: integer
          minimum: 0
        disks:
          type: array
          description: The files `deleteDisks` would delete.
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/DeleteBlocker"

    VmJobKind:
      type: string
      enum: [createVm, deleteVm, applyCompute, applyPerformance, performanceGuestSetup, exportDisks]

    VmJobState:
      type: string
      enum: [running, succeeded, failed]

    JobError:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string

    VmJob:
      type: object
      required: [id, kind, vmId, state, step, percentComplete, createdAt, updatedAt, error]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/VmJobKind"
        vmId:
          type: [string, "null"]
          format: uuid
          description: Null until a create job has defined its virtual machine.
        state:
          $ref: "#/components/schemas/VmJobState"
        step:
          type: string
          description: What the job is doing now, for example "Deleting disks".
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"

    HostRemoteDesktop:
      type: object
      required: [supported, enabled, port, firewallOpen, edition]
      properties:
        supported:
          type: boolean
          description: False on editions that cannot accept Remote Desktop connections (Windows Home).
        enabled:
          type: boolean
          description: Remote Desktop connections to the host are allowed.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The TCP port Remote Desktop listens on.
        firewallOpen:
          type: boolean
          description: The Windows Firewall "Remote Desktop" rule group is enabled for the current profile.
        edition:
          type: string
          description: The Windows edition, for display, for example "Windows 11 Pro".

    HostResources:
      type: object
      required: [logicalProcessorCount, totalMemoryMb, availableMemoryMb, memoryReserveMb, virtualHardDiskFolder, isoFolder]
      properties:
        logicalProcessorCount:
          type: integer
          minimum: 1
        totalMemoryMb:
          type: integer
          format: int64
        availableMemoryMb:
          type: integer
          format: int64
          description: Physical memory free right now.
        memoryReserveMb:
          type: integer
          format: int64
          description: The host warns when a VM would leave less than this free.
        virtualHardDiskFolder:
          type: string
          description: Where new VMs are created, chosen in the host tray (each VM gets its own folder there), or Hyper-V's default disk folder.
        isoFolder:
          type: string
          description: The ISO library folder on the host, chosen in the host tray.

    IsoImage:
      type: object
      required: [name, sizeBytes, modifiedAt, usedBy]
      properties:
        name:
          type: string
          description: The file name in the ISO library folder, ending in .iso.
        sizeBytes:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
        usedBy:
          type: array
          description: Names of the VMs (current settings or checkpoints) that have this image attached.
          items:
            type: string

    RenameIsoRequest:
      type: object
      required: [newName]
      properties:
        newName:
          type: string
          minLength: 5
          maxLength: 200
          description: A file name ending in .iso, without a folder.

    VirtualSwitch:
      type: object
      required: [id, name, isDefault]
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
          description: The NAT Default Switch. VMs on it are reachable only from the host.

    CreateVmRequest:
      type: object
      required: [name, isoName, diskSizeGb, processorCount, startupMemoryMb, maximumMemoryMb, dynamicMemory]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique on the host. Also names the VHDX file.
        isoName:
          type: string
          description: An image `name` from `GET /isos`.
        diskSizeGb:
          type: integer
          minimum: 1
          maximum: 65536
        processorCount:
          type: integer
          minimum: 1
          description: At most `HostResources.logicalProcessorCount`.
        startupMemoryMb:
          type: integer
          format: int64
          description: An even number of megabytes, at least 32.
        maximumMemoryMb:
          type: integer
          format: int64
          description: Used with dynamic memory; at least the startup memory.
        dynamicMemory:
          type: boolean
        switchId:
          type: [string, "null"]
          description: A switch `id` from `GET /switches`. Omitted or null selects the Default Switch.
        enableTpm:
          type: boolean
          default: true
          description: Add a virtual TPM, which Windows 11 needs.
        acknowledgeWarnings:
          type: boolean
          default: false
        install:
          description: |
            Install the OS unattended with a profile. The job writes an answer file ISO, attaches it as
            a second DVD, and starts the VM. Null means the OS is installed from the console.
          oneOf:
            - $ref: "#/components/schemas/UnattendedInstallRequest"
            - type: "null"

    InstallOs:
      type: string
      enum: [windows, linux]

    IsoInspection:
      type: object
      required: [os, distribution, editions]
      properties:
        os:
          description: Null when the image is neither Windows Setup media nor an Ubuntu installer.
          oneOf:
            - $ref: "#/components/schemas/InstallOs"
            - type: "null"
        distribution:
          type: [string, "null"]
          description: For example "Windows" or "Ubuntu-Server 24.04.1 LTS".
        editions:
          type: array
          description: Windows image names in install.wim, for example "Windows 11 Pro". Empty for Linux.
          items:
            type: string

    WindowsInstallSettings:
      type: object
      required: [defaultEdition]
      properties:
        defaultEdition:
          type: string
          maxLength: 100
          description: The image to install, by its name in install.wim. The create request can choose another.
        bypassHardwareChecks:
          type: boolean
          default: false
          description: Skip the Windows 11 TPM, Secure Boot, and memory checks (for VMs without a TPM).
        disableTelemetry:
          type: boolean
          default: true
        disableAdvertisingId:
          type: boolean
          default: true
        disableLocation:
          type: boolean
          default: true
        disableConsumerFeatures:
          type: boolean
          default: true
          description: Turn off suggested apps and other consumer experiences.

    LinuxInstallSettings:
      type: object
      properties:
        sshAuthorizedKeys:
          type: array
          maxItems: 10
          description: OpenSSH public keys (ssh-ed25519, ecdsa-sha2-nistp*, ssh-rsa) for the administrator.
          items:
            type: string
        packages:
          type: array
          maxItems: 50
          description: Extra apt packages. linux-cloud-tools-virtual is always added, so Hyper-V can read the guest address.
          items:
            type: string
        installDesktop:
          type: boolean
          default: true
          description: Install Xfce and xrdp, so Remote Desktop works.

    UnattendProfileRequest:
      type: object
      required: [name, os]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        os:
          $ref: "#/components/schemas/InstallOs"
        adminAccountName:
          type: string
          default: hhadmin
          description: |
            The local administrator Setup creates. The host gives it a one-time password and rotates
            it once setup is done. Windows names have up to 20 characters; Linux names are lowercase.
        timeZone:
          type: [string, "null"]
          description: A Windows time zone ID for Windows, an IANA ID for Linux. Null means the host time zone.
        locale:
          type: string
          default: en-US
        windows:
          description: Required when `os` is windows.
          oneOf:
            - $ref: "#/components/schemas/WindowsInstallSettings"
            - type: "null"
        linux:
          description: Required when `os` is linux.
          oneOf:
            - $ref: "#/components/schemas/LinuxInstallSettings"
            - type: "null"

    SetupProfile:
      type: object
      description: |
        A setup profile. In YAML files it also has `schemaVersion: 1`, and each item's name is a comment
        after its id; see schemas/profile.v1.schema.json for the id forms.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 500
        install:
          type: array
          description: winget ids (they contain a dot), Microsoft Store ids (12 capitals and digits), or package aliases resolved when the profile is applied.
          items:
            $ref: "#/components/schemas/ProfileItem"
        remove:
          $ref: "#/components/schemas/ProfileRemove"
        tweaks:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTweak"
        browser:
          $ref: "#/components/schemas/ProfileBrowser"

    ProfileItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
          description: The friendly name; written as a comment after the id in YAML.

    ProfileRemove:
      type: object
      properties:
        appx:
          type: array
          description: Provisioned package names without the version, for example Microsoft.BingNews.
          items:
            $ref: "#/components/schemas/ProfileItem"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ProfileItem"
        features:
          type: array
          items:
            $ref: "#/components/schemas/ProfileItem"

    ProfileTweak:
      type: object
      description: A curated tweak (`id`) or a custom registry value (`registry`), never both.
      properties:
        id:
          type: string
        name:
          type: string
        registry:
          $ref: "#/components/schemas/RegistryTweak"

    RegistryValueType:
      type: string
      enum: [dword, qword, string]

    RegistryTweak:
      type: object
      required: [key, name, type, value]
      properties:
        key:
          type: string
          description: Starts with HKLM\ or HKCU\ (HKCU applies to the User's account in the VM).
        name:
          type: string
          description: The value name; empty for the key's default value.
        type:
          $ref: "#/components/schemas/RegistryValueType"
        value:
          type: string
          description: Decimal for dword and qword.

    ProfileBrowser:
      type: object
      required: [app]
      properties:
        app:
          $ref: "#/components/schemas/ProfileItem"
        extensions:
          type: array
          description: Chrome Web Store ids, or edge:<id> for the Edge Add-ons store.
          items:
            $ref: "#/components/schemas/ProfileItem"
        policies:
          type: object
          description: Browser policies by friendly key from the browser catalog; values as text.
          additionalProperties:
            type: string

    SetupProfileSummary:
      type: object
      required: [id, name, description, installCount, removeCount, tweakCount, extensionCount, browser, updatedAt, error]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        installCount:
          type: integer
        removeCount:
          type: integer
        tweakCount:
          type: integer
        extensionCount:
          type: integer
        browser:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
        error:
          type: [string, "null"]
          description: Why the file on the host does not read; the counts are then zero.

    StoredSetupProfile:
      type: object
      required: [id, updatedAt, profile]
      properties:
        id:
          type: string
        updatedAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/SetupProfile"

    AppxRating:
      type: string
      enum: [unrated, safe, caution, keep]
      description: |
        From HyperHarbor's Appx catalog. `safe`: nothing depends on it (the debloat preset).
        `caution`: removable, but often expected. `keep`: frameworks, the Store, and security pieces.

    AppxBaselineSource:
      type: string
      enum: [unattendedInstall, manual]

    AppxBaselineInfo:
      type: object
      required: [key, build, edition, recordedAt, source, vmName, approximate]
      properties:
        key:
          type: string
          description: Major build and edition, for example 10.0.26100/Professional.
        build:
          type: string
        edition:
          type: string
        recordedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/AppxBaselineSource"
        vmName:
          type: [string, "null"]
        approximate:
          type: boolean
          description: The baseline is for the same build but another edition.

    AppxPackage:
      type: object
      required: [name, friendlyName, version, publisher, rating, note, inBaseline]
      properties:
        name:
          type: string
          description: The package name without the version; what profiles list under remove.appx.
        friendlyName:
          type: string
        version:
          type: string
        publisher:
          type: string
        rating:
          $ref: "#/components/schemas/AppxRating"
        note:
          type: [string, "null"]
        inBaseline:
          type: [boolean, "null"]
          description: Whether the clean baseline has it; null without a baseline.

    VmAppxInventory:
      type: object
      required: [vmId, build, edition, baseline, packages, removedFromBaseline]
      properties:
        vmId:
          type: string
          format: uuid
        build:
          type: string
          description: The full build, for example 10.0.26100.2033.
        edition:
          type: string
          description: EditionID, for example Professional.
        baseline:
          oneOf:
            - $ref: "#/components/schemas/AppxBaselineInfo"
            - type: "null"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/AppxPackage"
        removedFromBaseline:
          type: array
          description: In the baseline but no longer in the VM.
          items:
            $ref: "#/components/schemas/AppxPackage"

    PackageSearchResult:
      type: object
      required: [id, name, version, source]
      properties:
        id:
          type: string
          description: The winget id, for example Git.Git.
        name:
          type: string
        version:
          type: string
        source:
          type: string

    PackageCatalogItem:
      type: object
      required: [alias, id, name, category, popular]
      properties:
        alias:
          type: string
          description: What a profile may write instead of the winget id.
        id:
          type: string
        name:
          type: string
        category:
          type: string
        popular:
          type: boolean
          description: Listed on the package picker's Popular tab.

    ExtensionStore:
      type: string
      enum: [chrome, edge]
      description: Chrome Web Store ids work in Chrome, Brave, and Edge; Edge Add-ons ids only in Edge.

    ExtensionCatalogItem:
      type: object
      required: [id, name, category, description, edgeId]
      properties:
        id:
          type: string
          description: How a profile lists it, for example cjpalhdlnbpafiamejdnhcphjbkeiagm or edge:<id>.
        name:
          type: string
        category:
          type: string
        description:
          type: string
        edgeId:
          type: [string, "null"]
          description: The same extension in the Edge Add-ons store (edge:<id>), when it is there.

    ResolvedExtension:
      type: object
      required: [store, id, profileId, name, iconDataUrl, inCatalog]
      properties:
        store:
          $ref: "#/components/schemas/ExtensionStore"
        id:
          type: string
        profileId:
          type: string
          description: How a profile lists it.
        name:
          type: string
        iconDataUrl:
          type: [string, "null"]
          description: The store icon as a data URL; null for catalog entries and when the store has none.
        inCatalog:
          type: boolean

    UnattendProfile:
      type: object
      description: Settings for installing an OS without anyone at the console. Profiles never hold passwords.
      required: [id, name, builtIn, os, adminAccountName, timeZone, locale, windows, linux]
      properties:
        id:
          type: string
          description: A slug for built-in profiles, a GUID for the User's own.
        name:
          type: string
        builtIn:
          type: boolean
          description: Built-in profiles cannot be changed or deleted.
        os:
          $ref: "#/components/schemas/InstallOs"
        adminAccountName:
          type: string
        timeZone:
          type: string
        locale:
          type: string
        windows:
          oneOf:
            - $ref: "#/components/schemas/WindowsInstallSettings"
            - type: "null"
        linux:
          oneOf:
            - $ref: "#/components/schemas/LinuxInstallSettings"
            - type: "null"

    UnattendedInstallRequest:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          description: An `id` from `GET /unattend-profiles`.
        windowsEdition:
          type: [string, "null"]
          description: An edition from `GET /isos/{name}/inspection`. Null means the default edition of the profile.
        computerName:
          type: [string, "null"]
          description: Windows only, at most 15 letters, digits, or hyphens. Null means derived from the VM name.

    UnattendedInstallStatus:
      type: object
      required: [vmId, profileId, os, state, step, startedAt, updatedAt, error]
      properties:
        vmId:
          type: string
          format: uuid
        profileId:
          type: string
        os:
          $ref: "#/components/schemas/InstallOs"
        state:
          $ref: "#/components/schemas/UnattendedInstallState"
        step:
          type: string
          description: What is happening now, for example "Waiting for Remote Desktop to answer".
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type: [string, "null"]
          description: Why the install failed.

    UnattendedInstallState:
      type: string
      description: |
        `installing` (Setup is running), `awaitingConfirmation` (Ubuntu waits for "yes" at the console),
        `waitingForGuest` (no address yet), `waitingForRemoteAccess` (Remote Desktop or SSH not answering
        yet), `configuring` (the host sets up the User account), then `ready`, `failed`, or `canceled`.
      enum: [installing, awaitingConfirmation, waitingForGuest, waitingForRemoteAccess, configuring, ready, failed, canceled]

    GpuVendor:
      type: string
      enum: [nvidia, amd, intel, other]

    GpuPartitionShare:
      type: object
      description: Each percent sets the partition's minimum, maximum, and optimal values to that share of what the GPU offers.
      properties:
        instancePath:
          type: [string, "null"]
          description: A partitionable GPU's `instancePath` from `GET /host/gpu`. Null means the host's first partitionable GPU.
        vramPercent:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        encodePercent:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        decodePercent:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        computePercent:
          type: integer
          minimum: 1
          maximum: 100
          default: 50

    MmioSettings:
      type: object
      properties:
        lowGapMb:
          type: integer
          minimum: 128
          maximum: 3584
          default: 1024
        highGapMb:
          type: integer
          minimum: 1024
          maximum: 524288
          default: 32768

    PerformanceRdpSettings:
      type: object
      properties:
        hardwareEncoding:
          type: boolean
          default: false
          description: Experimental. Prefer the GPU for H.264/AVC encoding in the guest's Remote Desktop.

    PerformanceSettings:
      type: object
      required: [processorCount, memoryMb]
      properties:
        processorCount:
          type: integer
          minimum: 1
        memoryMb:
          type: integer
          format: int64
          description: Fixed memory; dynamic memory is turned off.
        gpu:
          oneOf:
            - $ref: "#/components/schemas/GpuPartitionShare"
            - type: "null"
        mmio:
          oneOf:
            - $ref: "#/components/schemas/MmioSettings"
            - type: "null"
        moveStorageTo:
          type: [string, "null"]
          description: Moves the VM's configuration and disks to this folder on the host. Null keeps them where they are.
        rdp:
          oneOf:
            - $ref: "#/components/schemas/PerformanceRdpSettings"
            - type: "null"
        acknowledgeWarnings:
          type: boolean
          default: false

    GuestSetupRequest:
      type: object
      properties:
        driversOnly:
          type: boolean
          default: false
          description: Copy the GPU driver only, for example after the host's driver changed.

    GuestDriverStatus:
      type: object
      required: [vendor, hostVersion, guestVersion, copiedAt, drift, rebootRequired]
      properties:
        vendor:
          $ref: "#/components/schemas/GpuVendor"
        hostVersion:
          type: [string, "null"]
        guestVersion:
          type: [string, "null"]
        copiedAt:
          type: [string, "null"]
          format: date-time
        drift:
          type: boolean
          description: True when the host's driver changed since it was copied into the guest.
        rebootRequired:
          type: boolean
          description: Some guest files were in use; they are replaced when the guest restarts.

    VmPerformance:
      type: object
      required: [vmId, enabled, settings, gpuAttached, driver, warnings]
      properties:
        vmId:
          type: string
          format: uuid
        enabled:
          type: boolean
        settings:
          description: As applied; null when Performance mode is off.
          oneOf:
            - $ref: "#/components/schemas/PerformanceSettings"
            - type: "null"
        gpuAttached:
          type: boolean
          description: True when the VM has a GPU partition adapter.
        driver:
          description: Null until the guest has been set up.
          oneOf:
            - $ref: "#/components/schemas/GuestDriverStatus"
            - type: "null"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    HostGpuDevice:
      type: object
      required: [name, vendor, driverVersion, partitionable, partitionCount, instancePath]
      properties:
        name:
          type: string
        vendor:
          $ref: "#/components/schemas/GpuVendor"
        driverVersion:
          type: [string, "null"]
        partitionable:
          type: boolean
        partitionCount:
          type: integer
        instancePath:
          type: [string, "null"]
          description: The value for `GpuPartitionShare.instancePath`; null when the GPU cannot be partitioned.

    GpuDriverWarning:
      type: object
      required: [provider, eventId, count, lastSeen, message]
      properties:
        provider:
          type: string
          description: The event provider, for example nvlddmkm.
        eventId:
          type: integer
        count:
          type: integer
        lastSeen:
          type: string
          format: date-time
        message:
          type: string

    HostGpu:
      type: object
      required: [gpus, warnings]
      properties:
        gpus:
          type: array
          items:
            $ref: "#/components/schemas/HostGpuDevice"
        warnings:
          type: array
          description: GPU driver errors in the host's System log in the last seven days.
          items:
            $ref: "#/components/schemas/GpuDriverWarning"

    ComputeSetting:
      type: string
      enum: [processorCount, startupMemoryMb, maximumMemoryMb, dynamicMemory, nestedVirtualization, macAddressSpoofing]

    VmComputeSettings:
      type: object
      required: [vmId, state, processorCount, startupMemoryMb, maximumMemoryMb, dynamicMemory, nestedVirtualization, macAddressSpoofing, networkAdapterCount, requiresOff]
      properties:
        vmId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/VmState"
        processorCount:
          type: integer
        startupMemoryMb:
          type: integer
          format: int64
        maximumMemoryMb:
          type: integer
          format: int64
          description: Equal to the startup memory when dynamic memory is off.
        dynamicMemory:
          type: boolean
        nestedVirtualization:
          type: boolean
        macAddressSpoofing:
          type: boolean
          description: True when every connected network adapter allows MAC address spoofing.
        networkAdapterCount:
          type: integer
          description: Network adapters connected to a switch.
        requiresOff:
          type: array
          description: Settings that can change only while the VM is off.
          items:
            $ref: "#/components/schemas/ComputeSetting"

    UpdateVmComputeRequest:
      type: object
      properties:
        processorCount:
          type: [integer, "null"]
        startupMemoryMb:
          type: [integer, "null"]
          format: int64
        maximumMemoryMb:
          type: [integer, "null"]
          format: int64
        dynamicMemory:
          type: [boolean, "null"]
        nestedVirtualization:
          type: [boolean, "null"]
        macAddressSpoofing:
          type: [boolean, "null"]
        shutDownToApply:
          type: boolean
          default: false
          description: For a running VM, shut it down, apply, and start it again as a job.
        acknowledgeWarnings:
          type: boolean
          default: false

    VmComputeUpdate:
      type: object
      required: [settings, job]
      description: Exactly one of `settings` (applied now) and `job` (shutting down to apply) is set.
      properties:
        settings:
          oneOf:
            - $ref: "#/components/schemas/VmComputeSettings"
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/VmJob"
            - type: "null"
